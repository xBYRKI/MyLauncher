[workspace]
resolver = "2"
members = ["crates/protocol", "crates/core", "crates/server", "app"]

[workspace.package]
version = "0.3.1"
edition = "2021"
authors = ["BYRKI"]
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
protocol = { path = "crates/protocol" }
launcher-core = { path = "crates/core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
# Nicht "s": größenoptimierte Builds erkennt Bitdefender (und alle Scanner mit seiner Engine)
# als Gen:Variant.Fugrafa – mit opt-level 3 ist der Launcher sauber.
opt-level = 3
