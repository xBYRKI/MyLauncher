[package]
name = "mylauncher"
version.workspace = true
edition.workspace = true
description = "Minecraft-Launcher mit Prism Launcher als Engine"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
launcher-core.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico", "bmp"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rfd = "0.15"
opener = "0.7"
notify = "8"

[build-dependencies]
winresource = "0.1"
