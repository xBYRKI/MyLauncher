<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}} – Download</title>
<link rel="icon" type="image/png" href="/launcher/logo.png">
<style>
  @font-face {
    font-family: "Monocraft";
    src: url("/launcher/font.ttf") format("truetype");
    font-display: swap;
  }
  :root {
    --bg: #111113;
    --panel: #1a1a1e;
    --border: #33333a;
    --text: #e8e8ea;
    --muted: #9b9ba3;
    --accent: {{accent}};
    --accent-ink: #1a1500;
    --mono: "Monocraft", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 var(--sans);
  }
  main {
    width: 100%;
    max-width: 520px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 32px 28px;
    text-align: center;
  }
  img.logo { width: 88px; height: 88px; image-rendering: pixelated; }
  h1 { font: 400 22px/1.3 var(--mono); margin: 16px 0 4px; }
  .tagline { color: var(--muted); margin: 0 0 24px; }
  a.button {
    display: inline-block;
    background: var(--accent);
    color: var(--accent-ink);
    font: 400 16px var(--mono);
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 6px;
    box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.25);
  }
  a.button:hover { filter: brightness(1.08); }
  a.button:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  .meta { color: var(--muted); font-size: 13px; margin: 12px 0 0; }
  .notes {
    text-align: left;
    border-top: 1px solid var(--border);
    margin-top: 24px;
    padding-top: 16px;
    white-space: pre-line;
  }
  .notes h2 { font: 400 13px var(--mono); color: var(--muted); margin: 0 0 6px; }
  .notes p { margin: 0; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 20px; text-align: left; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <img class="logo" src="/launcher/logo.png" alt="">
  <h1>{{name}}</h1>
  <p class="tagline">{{tagline}}</p>
  {{body}}
</main>
</body>
</html>
